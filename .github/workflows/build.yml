name: Build PIB Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: win
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: PIB-V1-Windows
          path: ${{ steps.build.outputs.build-output }}

